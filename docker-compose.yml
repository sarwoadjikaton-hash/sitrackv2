services:
  postgres:
    image: postgres:16-alpine
    container_name: sitrack_postgres
    environment:
      POSTGRES_DB: sitrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d sitrack" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sitrack_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sitrack_redis
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redisdata:/data
    networks:
      - sitrack_net
    restart: unless-stopped

  app:
    image: indmrtprg/sitrack-app:latest
    container_name: sitrack_app
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage/app
    networks:
      - sitrack_net
    restart: unless-stopped

  queue:
    image: indmrtprg/sitrack-app:latest
    container_name: sitrack_queue
    command: [ "php", "artisan", "queue:work", "redis", "--sleep=2", "--tries=3", "--timeout=90" ]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage/app
    networks:
      - sitrack_net
    restart: unless-stopped

  web:
    image: indmrtprg/sitrack-web:latest
    container_name: sitrack_web
    depends_on:
      - app
    volumes:
      - storage_data:/var/www/html/storage/app
    ports:
      - "8081:80"
    networks:
      - sitrack_net
    restart: unless-stopped

networks:
  sitrack_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  storage_data:
