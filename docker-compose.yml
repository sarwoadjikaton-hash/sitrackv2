services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sitrack_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      APP_NAME: SiTrack
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://192.168.223.103:8081
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: sitrack
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [sitrack_net]

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sitrack_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=2 --tries=3 --timeout=90
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      APP_NAME: SiTrack
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: sitrack
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [sitrack_net]

  web:
    image: nginx:1.27-alpine
    container_name: sitrack_web
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [sitrack_net]

  frontend:
    image: node:20-alpine
    container_name: sitrack_frontend
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5174:5173  "
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    environment:
      VITE_APP_NAME: SiTrack
    networks: [sitrack_net]

  postgres:
    image: postgres:16-alpine
    container_name: sitrack_postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: sitrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sitrack"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [sitrack_net]

  redis:
    image: redis:7-alpine
    container_name: sitrack_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [sitrack_net]

volumes:
  pgdata:
  redisdata:
  node_modules:
  vendor:

networks:
  sitrack_net:
    driver: bridge
