<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SiTrack logo">
  <defs>
    <clipPath id="c">
      <rect width="64" height="64" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="#0a1e42"/>

  <g clip-path="url(#c)">

    <!-- Location Pin (behind envelope) -->
    <path d="M 37,12 C 47,12 52,19 52,27 C 52,32 49,36 45,39 L 37,48 L 33,43 C 30,39 28,35 28,30 C 28,29 28,29 28.2,28.5" fill="#1a7a94"/>
    <path d="M 52,27 C 52,19 47,12 37,12 C 44,12 50,18 50,25 C 50,29 48,33 45,36 L 37,44" fill="#14667d"/>
    <circle cx="38" cy="25" r="6" fill="#0a1e42"/>
    <circle cx="38" cy="25" r="3.5" fill="none" stroke="#1a7a94" stroke-width="2"/>

    <!-- Envelope back flap -->
    <path d="M 12,29 L 32,17 L 45,25 L 45,29 L 12,29 Z" fill="#1a7a94" opacity="0.65"/>

    <!-- Envelope body -->
    <rect x="12" y="29" width="40" height="26" rx="1.5" fill="#FFFFFF"/>

    <!-- Right shadow -->
    <path d="M 43,29 L 52,29 L 52,55 L 43,55 Z" fill="#d8dfe8" opacity="0.5"/>

    <!-- Document -->
    <rect x="17" y="19" width="24" height="15" rx="2" fill="#FFFFFF"/>
    <line x1="21" y1="25" x2="33" y2="25" stroke="#0a1e42" stroke-width="1.3" stroke-linecap="round" opacity="0.45"/>
    <line x1="21" y1="29" x2="30" y2="29" stroke="#0a1e42" stroke-width="1.3" stroke-linecap="round" opacity="0.3"/>

    <!-- Envelope V-fold -->
    <path d="M 12,29 L 32,44 L 52,29" fill="none" stroke="#0a1e42" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.12"/>

    <!-- Checkmark badge -->
    <circle cx="50" cy="52" r="8" fill="#1a7a94"/>
    <circle cx="50" cy="52" r="6.5" fill="#1a7a94" stroke="#0a1e42" stroke-width="1"/>
    <path d="M 46,52 L 48.5,55 L 54.5,49" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  </g>
</svg>
