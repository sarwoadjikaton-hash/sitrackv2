<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SiTrack logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2b6b"/>
      <stop offset="45%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.4" flood-color="#04122f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="1" y="1" width="62" height="62" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>

  <!-- ambient glow behind icon -->
  <circle cx="33" cy="27" r="22" fill="url(#glow)"/>

  <!-- glossy top highlight -->
  <path d="M1 19 C 14 5, 50 5, 63 19 L63 26 C 50 14, 14 14, 1 26 Z" fill="url(#gloss)"/>

  <!-- dashed tracking trail -->
  <path d="M9 46 C 18 40, 24 38, 30 33" fill="none" stroke="url(#trail)" stroke-width="2.4"
        stroke-linecap="round" stroke-dasharray="0.2 5"/>
  <circle cx="9" cy="46" r="2.2" fill="#e0f2fe" opacity="0.9"/>

  <!-- paper plane (folded document taking flight) -->
  <g filter="url(#softShadow)">
    <path d="M55 15 L27 30.5 L33.5 34 L37 44.5 L41.5 36.5 L49 41 Z" fill="url(#plane)"/>
    <path d="M55 15 L27 30.5 L33.5 34 Z" fill="#ffffff"/>
    <path d="M55 15 L37 33.5 L37 44.5 L41.5 36.5 L49 41 Z" fill="#bfdbfe" opacity="0.9"/>
    <path d="M55 15 L37 33.5" stroke="#1d4ed8" stroke-opacity="0.35" stroke-width="1"/>
  </g>

  <!-- tracking check badge -->
  <circle cx="48" cy="47" r="10.5" fill="#0ea5e9" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M43 47.2 L46.4 50.6 L53.2 43.6" fill="none" stroke="#ffffff" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
