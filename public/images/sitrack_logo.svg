<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <clipPath id="bg-clip">
      <rect width="240" height="240" rx="52"/>
    </clipPath>
  </defs>

  <!-- Background: Deep Navy rounded square -->
  <rect width="240" height="240" rx="52" fill="#0a1e42"/>

  <g clip-path="url(#bg-clip)">

    <!-- ===== LOCATION PIN (behind envelope) ===== -->
    <!-- Large curved teal pin shape -->
    <path d="
      M 138,48
      C 168,48 192,72 192,102
      C 192,118 184,132 172,142
      L 138,178
      L 122,158
      C 112,146 104,132 104,116
      C 104,114 104,112 105,110
      " fill="#1a7a94" />

    <!-- Pin right side continuing down behind envelope -->
    <path d="
      M 192,102
      C 192,72 168,48 138,48
      C 162,48 182,68 182,94
      C 182,108 176,122 166,132
      L 138,162
      " fill="#14667d" />

    <!-- Pin inner circle (navy) -->
    <circle cx="142" cy="94" r="22" fill="#0a1e42"/>
    <!-- Pin inner ring (lighter teal arc) -->
    <path d="M 142,72 A 22,22 0 1,1 141.99,72" fill="none" stroke="#1a7a94" stroke-width="8"/>
    <circle cx="142" cy="94" r="14" fill="none" stroke="#0a1e42" stroke-width="2"/>


    <!-- ===== ENVELOPE ===== -->
    <!-- Envelope back flap (open, teal-tinted) -->
    <path d="M 46,108 L 120,62 L 168,92 L 168,108 L 46,108 Z" fill="#1a7a94" opacity="0.7"/>

    <!-- Envelope main body (white) -->
    <rect x="46" y="108" width="148" height="96" rx="4" fill="#FFFFFF"/>

    <!-- Envelope right side shadow -->
    <path d="M 160,108 L 194,108 L 194,204 L 160,204 Z" fill="#d8dfe8" opacity="0.6"/>

    <!-- ===== DOCUMENT inside envelope ===== -->
    <!-- Paper/document sticking out of envelope -->
    <rect x="62" y="72" width="90" height="54" rx="6" fill="#FFFFFF"/>
    <!-- Document text lines -->
    <line x1="76" y1="92" x2="120" y2="92" stroke="#0a1e42" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <line x1="76" y1="104" x2="108" y2="104" stroke="#0a1e42" stroke-width="4" stroke-linecap="round" opacity="0.35"/>

    <!-- ===== ENVELOPE FRONT FOLDS ===== -->
    <!-- Bottom V-fold / flap lines -->
    <path d="M 46,108 L 120,164 L 194,108"
          fill="none" stroke="#0a1e42" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.15"/>

    <!-- Left diagonal fold -->
    <path d="M 46,204 L 110,148" fill="none" stroke="#0a1e42" stroke-width="3" stroke-linecap="round" opacity="0.08"/>
    <!-- Right diagonal fold -->
    <path d="M 194,204 L 130,148" fill="none" stroke="#0a1e42" stroke-width="3" stroke-linecap="round" opacity="0.08"/>

    <!-- Top border of envelope body -->
    <line x1="46" y1="108" x2="194" y2="108" stroke="#0a1e42" stroke-width="2" opacity="0.08"/>

    <!-- ===== CHECKMARK BADGE ===== -->
    <!-- Badge outer circle -->
    <circle cx="186" cy="196" r="26" fill="#1a7a94"/>
    <!-- Badge inner border -->
    <circle cx="186" cy="196" r="22" fill="#1a7a94" stroke="#0a1e42" stroke-width="3"/>
    <!-- Checkmark -->
    <path d="M 173,196 L 181,205 L 200,186"
          fill="none" stroke="#FFFFFF" stroke-width="5.5"
          stroke-linecap="round" stroke-linejoin="round"/>

  </g>
</svg>
